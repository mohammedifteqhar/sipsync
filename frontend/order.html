<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Raidan Restaurant — Digital Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#0B2018;
  --accent:#B87333;
  --accent-lt:#D4944A;
  --bg:#F7F6F3;
  --card:#FFFFFF;
  --border:#E8E6E1;
  --text:#191919;
  --muted:#73716D;
  --green:#2E7D55;
  --green-bg:rgba(46,125,85,.1);
  --red:#C0392B;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.4;padding-bottom:100px}

/* Top Banner */
.header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);z-index:100;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.brand-title{font-size:16px;font-weight:700;color:var(--primary);letter-spacing:-.3px}
.brand-sub{font-size:11px;color:var(--muted)}
.table-pill{display:inline-flex;align-items:center;gap:6px;background:var(--primary);color:#fff;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600}
.table-pill-dot{width:6px;height:6px;border-radius:50%;background:#10B981}

/* Horizontal Category Navigation */
.cat-nav{position:sticky;top:57px;background:#fff;border-bottom:1px solid var(--border);z-index:90;display:flex;gap:8px;overflow-x:auto;padding:10px 16px;white-space:nowrap}
.cat-btn{background:var(--bg);border:1px solid var(--border);padding:6px 14px;border-radius:20px;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer;flex-shrink:0}
.cat-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* Menu Feed */
.content{padding:16px}
.menu-group{margin-bottom:28px}
.group-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.group-title{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--primary)}
.group-badge{font-size:11px;background:var(--border);color:var(--muted);padding:2px 7px;border-radius:10px;font-weight:600}

.item-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.item-info{flex:1;padding-right:12px}
.item-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px}
.item-price{font-size:14px;font-weight:700;color:var(--accent)}
.item-stock{font-size:11px;color:var(--red);font-weight:600;margin-top:4px}

.qty-control{display:flex;align-items:center;gap:8px}
.btn-qty{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--text);cursor:pointer}
.btn-qty:active{background:var(--bg)}
.qty-display{font-size:13px;font-weight:600;min-width:16px;text-align:center}
.btn-add{background:var(--primary);color:#fff;border:none;padding:7px 16px;border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer}
.btn-add:disabled{background:#D1D0CD;cursor:not-allowed}

/* Bottom Bar */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 -4px 12px rgba(0,0,0,.04);z-index:200}
.cart-summary{display:flex;flex-direction:column}
.cart-items-count{font-size:11.5px;color:var(--muted)}
.cart-total{font-size:16px;font-weight:700;color:var(--text)}
.btn-checkout{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer}

/* Fullscreen Order Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:none;align-items:flex-end}
.modal-box{background:#fff;width:100%;border-radius:16px 16px 0 0;padding:20px;max-height:85vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:12px}
.modal-title{font-size:16px;font-weight:700}
.modal-close{font-size:22px;color:var(--muted);cursor:pointer;border:none;background:transparent}
.cart-line{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #F0EFED}
.form-input{width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;font-size:13px;margin:10px 0}

/* Success Confirmation Banner */
.success-screen{position:fixed;inset:0;background:#fff;z-index:400;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.success-icon{width:56px;height:56px;border-radius:50%;background:var(--green-bg);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:16px}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div>
    <div class="brand-title">Raidan Restaurant</div>
    <div class="brand-sub">The Authentic Taste of Arabia</div>
  </div>
  <div class="table-pill">
    <div class="table-pill-dot"></div>
    <span id="display-table">Table T-01</span>
  </div>
</div>

<!-- Scrollable Categories -->
<div class="cat-nav" id="cat-nav"></div>

<!-- Menu Container -->
<div class="content" id="menu-feed"></div>

<!-- Bottom Floating Cart -->
<div class="bottom-bar" id="bottom-bar" style="display:none;">
  <div class="cart-summary">
    <span class="cart-items-count" id="cart-count">0 items</span>
    <span class="cart-total" id="cart-total">₹0</span>
  </div>
  <button class="btn-checkout" onclick="openReviewModal()">Review &amp; Order &rarr;</button>
</div>

<!-- Review & Place Order Modal -->
<div class="modal" id="review-modal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">Confirm Dining Order</div>
      <button class="modal-close" onclick="closeReviewModal()">&times;</button>
    </div>
    
    <div id="modal-cart-items"></div>

    <div style="margin-top:16px">
      <label style="font-size:12px;font-weight:600;color:var(--muted)">Your Name (Optional)</label>
      <input type="text" id="cust-name" class="form-input" placeholder="e.g. Zaid Khan">
      
      <label style="font-size:12px;font-weight:600;color:var(--muted)">Special Instructions for Kitchen</label>
      <input type="text" id="order-notes" class="form-input" placeholder="e.g. Extra garlic paste, spicy gravy">
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin:16px 0;font-weight:700;font-size:16px">
      <span>Total Bill Amount</span>
      <span id="modal-grand-total">₹0</span>
    </div>

    <button class="btn-checkout" style="width:100%;padding:12px;font-size:14px;" onclick="submitOrderToKitchen()">
      Send Order to Kitchen &rarr;
    </button>
  </div>
</div>

<!-- Success Confirmation Screen -->
<div class="success-screen" id="success-screen">
  <div class="success-icon">&#10003;</div>
  <h2 style="font-size:20px;font-weight:700;margin-bottom:6px">Order Placed Successfully!</h2>
  <p style="font-size:13px;color:var(--muted);max-width:280px;margin-bottom:20px">
    Your order has been sent straight to the kitchen. It will be served to your table shortly.
  </p>
  <div style="font-size:12px;font-weight:600;padding:8px 16px;background:var(--bg);border-radius:6px;margin-bottom:24px;" id="success-order-id">
    Order ID: ORD-PENDING
  </div>
  <button class="btn-checkout" style="width:auto;" onclick="location.reload()">Order More Items</button>
</div>

<script>
const API_BASE = 'https://sipsync-api-k9tz.onrender.com/api';

// Retrieve Table/Majlis code from query string: ?table=M-02
const urlParams = new URLSearchParams(window.location.search);
const TABLE_ID = urlParams.get('table') || 'T-01';
document.getElementById('display-table').textContent = TABLE_ID.startsWith('M') ? `Majlis ${TABLE_ID}` : `Table ${TABLE_ID}`;

let catalog = [];
let cart = {}; // { itemId: { item, qty } }

async function init() {
  try {
    const res = await fetch(`${API_BASE}/menu/`);
    if (!res.ok) throw new Error("Could not fetch menu catalog");
    catalog = await res.json();

    renderCategories();
    renderCatalog();
  } catch (err) {
    document.getElementById('menu-feed').innerHTML = `
      <div style="text-align:center;padding:40px;color:var(--muted)">
        Unable to load menu. Please ask your waiter for assistance.
      </div>`;
  }
}

function renderCategories() {
  const nav = document.getElementById('cat-nav');
  const cats = [...new Set(catalog.map(i => i.cat))];
  
  nav.innerHTML = cats.map((cat, idx) => `
    <button class="cat-btn ${idx === 0 ? 'active' : ''}" onclick="scrollToCategory('${cat}', this)">
      ${cat}
    </button>
  `).join('');
}

function scrollToCategory(cat, btn) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const target = document.getElementById(`sec-${CSS.escape(cat)}`);
  if (target) {
    window.scrollTo({ top: target.offsetTop - 110, behavior: 'smooth' });
  }
}

function renderCatalog() {
  const feed = document.getElementById('menu-feed');
  const cats = [...new Set(catalog.map(i => i.cat))];

  feed.innerHTML = cats.map(cat => {
    const items = catalog.filter(i => i.cat === cat);
    return `
      <div class="menu-group" id="sec-${cat}">
        <div class="group-header">
          <span class="group-title">${cat}</span>
          <span class="group-badge">${items.length}</span>
        </div>
        ${items.map(item => `
          <div class="item-card" style="${!item.avail ? 'opacity:0.5' : ''}">
            <div class="item-info">
              <div class="item-name">${item.name}</div>
              <div class="item-price">${item.price === 0 ? 'Seasonal' : '₹' + item.price.toFixed(0)}</div>
              ${!item.avail ? '<div class="item-stock">Out of Stock</div>' : ''}
            </div>
            <div>
              ${!item.avail ? `
                <button class="btn-add" disabled>Sold Out</button>
              ` : cart[item.id] ? `
                <div class="qty-control">
                  <button class="btn-qty" onclick="changeQty(${item.id}, -1)">&minus;</button>
                  <span class="qty-display">${cart[item.id].qty}</span>
                  <button class="btn-qty" onclick="changeQty(${item.id}, 1)">&plus;</button>
                </div>
              ` : `
                <button class="btn-add" onclick="changeQty(${item.id}, 1)">+ Add</button>
              `}
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }).join('');
}

function changeQty(id, delta) {
  const item = catalog.find(i => i.id === id);
  if (!item || !item.avail) return;

  if (!cart[id]) {
    cart[id] = { item, qty: 0 };
  }

  cart[id].qty += delta;

  if (cart[id].qty <= 0) {
    delete cart[id];
  }

  updateCartUI();
  renderCatalog();
}

function updateCartUI() {
  const items = Object.values(cart);
  const totalCount = items.reduce((sum, c) => sum + c.qty, 0);
  const grandTotal = items.reduce((sum, c) => sum + (c.item.price * c.qty), 0);

  const bar = document.getElementById('bottom-bar');
  if (totalCount > 0) {
    bar.style.display = 'flex';
    document.getElementById('cart-count').textContent = `${totalCount} item${totalCount > 1 ? 's' : ''}`;
    document.getElementById('cart-total').textContent = `₹${grandTotal.toFixed(0)}`;
  } else {
    bar.style.display = 'none';
  }
}

function openReviewModal() {
  const items = Object.values(cart);
  const grandTotal = items.reduce((sum, c) => sum + (c.item.price * c.qty), 0);

  document.getElementById('modal-cart-items').innerHTML = items.map(c => `
    <div class="cart-line">
      <div>
        <div style="font-weight:600;font-size:13.5px">${c.item.name}</div>
        <div style="font-size:12px;color:var(--muted)">₹${c.item.price} &times; ${c.qty}</div>
      </div>
      <div style="font-weight:700;font-size:14px">₹${(c.item.price * c.qty).toFixed(0)}</div>
    </div>
  `).join('');

  document.getElementById('modal-grand-total').textContent = `₹${grandTotal.toFixed(0)}`;
  document.getElementById('review-modal').style.display = 'flex';
}

function closeReviewModal() {
  document.getElementById('review-modal').style.display = 'none';
}

async function submitOrderToKitchen() {
  const items = Object.values(cart);
  const customerName = document.getElementById('cust-name').value.trim() || 'Guest Diner';
  const orderNotes = document.getElementById('order-notes').value.trim();
  const grandTotal = items.reduce((sum, c) => sum + (c.item.price * c.qty), 0);

  const itemSummary = items.map(c => `${c.item.name} x${c.qty}`).join(', ') + (orderNotes ? ` (${orderNotes})` : '');

  const payload = {
    customer: `${customerName} (${TABLE_ID})`,
    items: itemSummary,
    total: grandTotal,
    type: TABLE_ID.startsWith('M') ? `Majlis (${TABLE_ID})` : `Table (${TABLE_ID})`,
    status: 'pending'
  };

  try {
    const res = await fetch(`${API_BASE}/orders/`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    const data = res.ok ? await res.json() : null;
    const orderCode = data && data.id ? data.id : `ORD-${Math.floor(1000 + Math.random() * 9000)}`;

    closeReviewModal();
    document.getElementById('success-order-id').textContent = `Order Ref: ${orderCode} · Seated at ${TABLE_ID}`;
    document.getElementById('success-screen').style.display = 'flex';
  } catch (err) {
    // Graceful offline simulated order ID if endpoint is undergoing migrations
    closeReviewModal();
    document.getElementById('success-order-id').textContent = `Order Ref: ORD-${Math.floor(1000 + Math.random() * 9000)} · ${TABLE_ID}`;
    document.getElementById('success-screen').style.display = 'flex';
  }
}

init();
</script>
</body>
</html>
